[project]
name = "dataagent-python"
version = "0.1.0"
description = "Independent FastAPI and LangGraph DataAgent backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy",
  "pymysql[rsa]",
  "httpx",
  "pydantic-settings",
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "redis",
  "psycopg[binary]",
  "sqlparse>=0.6.1",
  "python-multipart>=0.0.33",
  "openpyxl>=3.1.5",
  "xlrd>=2.0.2",
  "pypdf>=7.1.0",
  "python-docx>=1.2.0",
  "pillow>=13.0.0",
  "tiktoken>=0.14.0",
  "psutil>=7.2.2",
  "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "xlwt>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
